# Pull request checks: Go vet/tests for the components and the shared billing
# module, Terraform fmt/validate, and a terraform plan against staging posted
# to the PR.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.16.5

jobs:
  go:
    name: go (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [billing, producer, consumer, account, ocr_container]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.component }}/go.mod
          cache-dependency-path: |
            ${{ matrix.component }}/go.sum
            billing/go.sum
      - name: Install tesseract
        if: matrix.component == 'ocr_container'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ell
      # The integration tag also vets the integration tests, which need the
      # emulators to run.
      - run: go vet -tags integration ./...
      - run: go test ./...

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    needs: terraform
    # Fork PRs get no OIDC token for this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # No environment: the staging app's pull_request federated credential and
    # the repo-level variables (staging values) apply.
    env:
      RG: ${{ vars.AZURE_RG }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Plan
        run: |
          # Compare against the image the job runs now, as staging.yml deploys it.
          image=$(az resource show -g "$RG" -n caj-ocr-staging --resource-type Microsoft.App/jobs \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
          if [[ -n "$image" ]]; then
            export TF_VAR_ocr_image=$image
          fi
          cd infra
          terraform init \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=staging"
          # Read-only: don't hold the state lock a deploy may need.
          terraform plan -lock=false -var-file=staging.tfvars -out=tfplan
          terraform show -no-color tfplan >"$GITHUB_WORKSPACE/plan.txt"
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Terraform plan (staging)"
            echo
            echo "Commit ${{ github.event.pull_request.head.sha }}."
            echo
            echo '```diff'
            # Stay under the 64 KB comment limit.
            head -c 60000 plan.txt
            echo '```'
          } >comment.md
          cat comment.md >>"$GITHUB_STEP_SUMMARY"
          .github/scripts/pr-comment.sh "$PR" '<!-- ci:terraform-plan -->' comment.md
