# Deploys the infra stack, the Function apps and/or the OCR image to staging,
# then smoke-tests the environment. prod.yml promotes the same commit.
name: staging

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, infra, functions, ocr]
        default: all

permissions:
  contents: read
  id-token: write

# One staging deployment at a time.
concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  build-functions:
    if: inputs.target == 'all' || inputs.target == 'functions'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [producer, consumer]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.app }}/go.mod
          cache-dependency-path: ${{ matrix.app }}/go.sum
      - run: npm install -g azure-functions-core-tools@4
      # Builds bin/app for linux/amd64 and zips it with host.json, the layout
      # the Flex Go runtime expects.
      - name: Package
        run: func pack -o dist
        env:
          FUNCTIONS_WORKER_RUNTIME: native
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.app }}/dist/${{ matrix.app }}.zip
          if-no-files-found: error

  # Pushes ghcr.io/<owner>/ocr-container:<sha>; prod.yml deploys that tag.
  build-ocr:
    if: inputs.target == 'all' || inputs.target == 'ocr'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image ref
        id: image
        # ghcr.io needs a lowercase owner.
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ocr-container:$GITHUB_SHA" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: ocr_container
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Infra first, so the OCR and function deploys find the stack's resources.
  deploy:
    needs: [build-functions, build-ocr]
    # Run when the builds this target doesn't need were skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      ENV: staging
      RG: ${{ vars.AZURE_RG }}
      INFRA: ${{ inputs.target == 'all' || inputs.target == 'infra' }}
      FUNCTIONS: ${{ inputs.target == 'all' || inputs.target == 'functions' }}
      OCR: ${{ inputs.target == 'all' || inputs.target == 'ocr' }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # --- infra
      # The image comes from the OCR deploy; keep the one the job runs now.
      # The bicepparam files read OCR_IMAGE and fall back to the quickstart
      # image.
      - name: Current OCR image
        if: env.INFRA == 'true'
        run: |
          image=$(az resource show -g "$RG" -n "caj-ocr-$ENV" --resource-type Microsoft.App/jobs \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
          echo "OCR image: ${image:-none yet, using the quickstart image}"
          if [[ -n "$image" ]]; then
            echo "OCR_IMAGE=$image" >>"$GITHUB_ENV"
          fi
      - name: What-if
        if: env.INFRA == 'true'
        run: |
          az deployment group what-if -g "$RG" \
            -f infra/main.bicep -p "infra/main.$ENV.bicepparam" \
            --exclude-change-types Ignore NoChange
      - name: Deploy stack
        if: env.INFRA == 'true'
        run: |
          az stack group create -g "$RG" -n text-extraction \
            -f infra/main.bicep -p "infra/main.$ENV.bicepparam" \
            --deny-settings-mode none --action-on-unmanage deleteResources \
            --description "text-extraction $ENV, ${{ github.sha }}" \
            --yes --query outputs -o json

      # --- ocr
      # Later stack deploys read the image back from the job and keep it.
      - name: Update OCR job image
        if: env.OCR == 'true'
        run: |
          az extension add -n containerapp --upgrade --yes
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ocr-container:$GITHUB_SHA"
          job=$(az stack group show -g "$RG" -n text-extraction --query outputs.ocrJobName.value -o tsv)
          az containerapp job update -g "$RG" -n "$job" --image "$image" \
            --query 'properties.template.containers[0].image' -o tsv

      # --- functions
      - uses: actions/download-artifact@v8
        if: env.FUNCTIONS == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Function app names
        if: env.FUNCTIONS == 'true'
        id: apps
        run: |
          for app in producer consumer; do
            name=$(az stack group show -g "$RG" -n text-extraction \
              --query "outputs.${app}Name.value" -o tsv)
            echo "$app=$name" >>"$GITHUB_OUTPUT"
          done
      - uses: Azure/functions-action@v1
        if: env.FUNCTIONS == 'true'
        with:
          app-name: ${{ steps.apps.outputs.producer }}
          package: dist/producer.zip
          sku: flexconsumption
      - uses: Azure/functions-action@v1
        if: env.FUNCTIONS == 'true'
        with:
          app-name: ${{ steps.apps.outputs.consumer }}
          package: dist/consumer.zip
          sku: flexconsumption

  smoke:
    needs: deploy
    # deploy's skipped builds would otherwise skip this job too.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: infra/smoke.sh "${{ vars.AZURE_RG }}"
