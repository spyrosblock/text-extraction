# Builds the producer and/or consumer Function apps once, deploys the package
# to staging, smoke-tests staging, then deploys the same package to prod
# after approval (the prod environment's required reviewers).
name: functions

on:
  workflow_dispatch:
    inputs:
      app:
        description: Function app(s) to deploy
        type: choice
        options: [both, producer, consumer]
        default: both

permissions:
  contents: read
  id-token: write

concurrency:
  group: functions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy: &apps
      matrix:
        app: ${{ fromJSON(inputs.app == 'both' && '["producer","consumer"]' || format('["{0}"]', inputs.app)) }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.app }}/go.mod
          cache-dependency-path: ${{ matrix.app }}/go.sum
      - run: npm install -g azure-functions-core-tools@4
      # Builds bin/app for linux/amd64 and zips it with host.json, the layout
      # the Flex Go runtime expects.
      - name: Package
        run: func pack -o dist
        env:
          FUNCTIONS_WORKER_RUNTIME: native
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.app }}/dist/${{ matrix.app }}.zip
          if-no-files-found: error

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    strategy: *apps
    environment: staging
    env:
      RG: ${{ vars.AZURE_RG }}
    steps: &deploy
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.app }}
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: App name
        id: app
        run: |
          name=$(az stack group show -g "$RG" -n text-extraction \
            --query 'outputs.${{ matrix.app }}Name.value' -o tsv)
          echo "name=$name" >>"$GITHUB_OUTPUT"
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: ${{ matrix.app }}.zip
          sku: flexconsumption

  smoke-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: infra/smoke.sh "${{ vars.AZURE_RG }}"

  deploy-prod:
    needs: smoke-staging
    runs-on: ubuntu-latest
    strategy: *apps
    environment: prod
    env:
      RG: ${{ vars.AZURE_RG }}
    steps: *deploy
