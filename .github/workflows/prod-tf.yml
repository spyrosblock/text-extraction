# prod.yml with the infrastructure from Terraform (infra/terraform), in the
# prod-tf environment (rg-textextract-prod-tf), after approval (the prod-tf
# environment's required reviewers). Run it on a commit staging.yml or
# staging-tf.yml has deployed: it reuses that run's OCR image tag. Every
# deploy step is in one job, so a run needs one approval.
name: prod-tf

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, infra, functions, ocr]
        default: all

permissions:
  contents: read
  id-token: write

# One prod-tf deployment at a time.
concurrency:
  group: prod-tf
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5

jobs:
  build-functions:
    if: inputs.target == 'all' || inputs.target == 'functions'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [producer, consumer]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.app }}/go.mod
          cache-dependency-path: ${{ matrix.app }}/go.sum
      - run: npm install -g azure-functions-core-tools@4
      # Builds bin/app for linux/amd64 and zips it with host.json, the layout
      # the Flex Go runtime expects.
      - name: Package
        run: func pack -o dist
        env:
          FUNCTIONS_WORKER_RUNTIME: native
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}
          path: ${{ matrix.app }}/dist/${{ matrix.app }}.zip
          if-no-files-found: error

  # Infra first, so the OCR and function deploys find the resources.
  deploy:
    needs: build-functions
    # Run when the build was skipped (no functions in this target).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: prod-tf
    env:
      ENV: prod
      RG: ${{ vars.AZURE_RG }}
      INFRA: ${{ inputs.target == 'all' || inputs.target == 'infra' }}
      FUNCTIONS: ${{ inputs.target == 'all' || inputs.target == 'functions' }}
      OCR: ${{ inputs.target == 'all' || inputs.target == 'ocr' }}
      # Terraform signs in with the job's OIDC token, for the providers and
      # the state backend alike.
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
    steps:
      - uses: actions/checkout@v7
      # Fail before touching Azure if staging hasn't pushed this commit's
      # image. The package is public, so no login.
      - name: OCR image
        if: env.OCR == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ocr-container:$GITHUB_SHA"
          if ! docker buildx imagetools inspect "$image" >/dev/null; then
            echo "::error::$image not found. Deploy this commit to staging-tf (target all or ocr) first."
            exit 1
          fi
          echo "OCR_JOB_IMAGE=$image" >>"$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Every target reads the state's outputs.
      - name: Terraform init
        run: |
          terraform -chdir=infra/terraform init \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=prod-tf"

      # --- infra
      # The image comes from the OCR deploy; keep the one the job runs now.
      # ocr_image falls back to the quickstart image.
      - name: Current OCR image
        if: env.INFRA == 'true'
        run: |
          image=$(az resource show -g "$RG" -n "caj-ocr-$ENV" --resource-type Microsoft.App/jobs \
            --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
          echo "OCR image: ${image:-none yet, using the quickstart image}"
          if [[ -n "$image" ]]; then
            echo "TF_VAR_ocr_image=$image" >>"$GITHUB_ENV"
          fi
      - name: Plan
        if: env.INFRA == 'true'
        run: terraform -chdir=infra/terraform plan -var-file="$ENV.tfvars" -out=tfplan
      - name: Apply
        if: env.INFRA == 'true'
        run: terraform -chdir=infra/terraform apply tfplan
      - name: Outputs
        id: outputs
        run: echo "json=$(terraform -chdir=infra/terraform output -json | jq -c .)" >>"$GITHUB_OUTPUT"

      # --- ocr
      # Later infra deploys read the image back from the job and keep it.
      - name: Update OCR job image
        if: env.OCR == 'true'
        env:
          OUTPUTS: ${{ steps.outputs.outputs.json }}
        run: |
          az extension add -n containerapp --upgrade --yes
          job=$(jq -r .ocrJobName.value <<<"$OUTPUTS")
          az containerapp job update -g "$RG" -n "$job" --image "$OCR_JOB_IMAGE" \
            --query 'properties.template.containers[0].image' -o tsv

      # --- functions
      - uses: actions/download-artifact@v8
        if: env.FUNCTIONS == 'true'
        with:
          path: dist
          merge-multiple: true
      - uses: Azure/functions-action@v1
        if: env.FUNCTIONS == 'true'
        with:
          app-name: ${{ fromJSON(steps.outputs.outputs.json).producerName.value }}
          package: dist/producer.zip
          sku: flexconsumption
      - uses: Azure/functions-action@v1
        if: env.FUNCTIONS == 'true'
        with:
          app-name: ${{ fromJSON(steps.outputs.outputs.json).consumerName.value }}
          package: dist/consumer.zip
          sku: flexconsumption
